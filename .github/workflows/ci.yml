name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build (Android, desktop, web, server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting against the Kotlin coding conventions
        run: ./gradlew spotlessCheck
      - name: Run tests
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest :server:test
      - name: Build every target that builds on Linux
        run: >
          ./gradlew
          :androidApp:assembleDebug
          :desktopApp:assemble
          :webApp:wasmJsBrowserDistribution
          :server:assemble
      - name: Report shared code
        run: ./gradlew sharedCodeReport

  ios:
    name: Compile and test shared code for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the shared engine on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Link the Compose framework for iOS
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
